name: CI & CD
on:
  push:
    branches:
      - '**'
jobs:
  Build-and-Deploy:
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN }}

      - uses: pnpm/action-setup@v4
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN }}
        with:
          version: 10

      - uses: actions/setup-node@v6
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN }}
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN }}
        run: pnpm i --frozen-lockfile

      - name: Deploy to CloudFlare (production)
        id: cf-deploy
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN && github.ref == 'refs/heads/main' }}
        run: pnpm run deploy

      - name: Preview on CloudFlare (branch)
        id: cf-preview
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail

          pnpm exec opennextjs-cloudflare build

          BRANCH_SLUG=$(echo "$GITHUB_REF_NAME" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-28)
          ALIAS="b-${BRANCH_SLUG}"

          OUTPUT=$(pnpm exec wrangler versions upload --tag "$ALIAS" 2>&1)
          echo "$OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo "wrangler-output<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID && env.CLOUDFLARE_API_TOKEN && github.ref != 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number' 2>/dev/null || true)
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr comment "$PR_NUMBER" --body "### CloudFlare 预览部署

          ${{ steps.cf-preview.outputs.wrangler-output }}"
          fi

      - name: Lark notification
        uses: Open-Source-Bazaar/feishu-action@v3
        with:
          url: ${{ secrets.LARK_CHATBOT_HOOK_URL }}
          msg_type: interactive
          content: |
            schema: "2.0"
            config:
              wide_screen_mode: true
            header:
              title:
                tag: plain_text
                content: CloudFlare 部署通知
              template: blue
            body:
              elements:
                - tag: markdown
                  content: |
                    **Git 仓库：** [${{ github.server_url }}/${{ github.repository }}](${{ github.server_url }}/${{ github.repository }})
                    **代码分支：** [${{ github.ref }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }})
                    **提交作者：** [${{ github.actor }}](${{ github.server_url }}/${{ github.actor }})

